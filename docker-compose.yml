version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: yazaki-n8n-db
    environment:
      POSTGRES_DB: ${DB_NAME:-n8n}
      POSTGRES_USER: ${DB_USER:-n8n}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-n8n_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yazaki-network

  n8n:
    image: n8nio/n8n:latest
    container_name: yazaki-n8n-app
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRE_HOST: 127.0.0.1
      DB_POSTGRE_PORT: 5432
      DB_POSTGRE_DATABASE: ${DB_NAME:-n8n}
      DB_POSTGRE_USER: ${DB_USER:-n8n}
      DB_POSTGRE_PASSWORD: ${DB_PASSWORD:-n8n_password}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678}
      GENERIC_TIMEZONE: America/Sao_Paulo
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yazaki-network
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:

networks:
  yazaki-network:
    driver: bridge
